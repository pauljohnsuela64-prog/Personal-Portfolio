<!doctype html>
<html lang="en">
  <head>
    <link rel="preload" as="image" href="/images/profile-480.jpg" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script id="theme-init">
      // Apply before paint; keep preference handling aligned with useTheme.
      (() => {
        let saved
        try { saved = localStorage.getItem('portfolio-theme') } catch { /* Use system preference. */ }
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
